<script>


const links = document.querySelectorAll(
    "[data-section]"
);


const sections = document.querySelectorAll(
    ".section-content"
);


links.forEach(function(link) {


    link.addEventListener(
        "click",
        function(event) {


            event.preventDefault();


            /*
             * LISTENING
             * Ouvre directement la playlist YouTube.
             */

            if (
                this.dataset.section === "listening"
            ) {

                window.open(
                    "https://www.youtube.com/playlist?list=PLy9gHk_NVVrAcjed-cxqgJEWR7yUiEwkp",
                    "_blank"
                );

                return;

            }


            /*
             * Retire la sélection actuelle.
             */

            links.forEach(function(item) {

                item.classList.remove("active");

            });


            /*
             * Cache toutes les sections.
             */

            sections.forEach(function(section) {

                section.classList.remove("active");

            });


            /*
             * Active le lien cliqué.
             */

            this.classList.add("active");


            /*
             * Affiche la section correspondante.
             */

            const sectionId =
                this.dataset.section + "-content";


            const section =
                document.getElementById(sectionId);


            if (section) {

                section.classList.add("active");

            }


        }
    );


});


</script>
